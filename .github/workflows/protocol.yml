name: Протокол

# Каждый пуш, задевший контракт: проверяем, что protocol.json цел, и
# пересобираем Word-версию спеки — чтобы документ для подрядчиков не
# расходился с проектом, даже если его забыли пересобрать руками.

on:
  push:
    paths:
      - 'protocol.json'
      - 'docs/PROTOCOL.md'
      - 'docs/build_protocol_docx.js'
      - '.github/workflows/protocol.yml'
  pull_request:
    paths:
      - 'protocol.json'
      - 'docs/PROTOCOL.md'
      - 'docs/build_protocol_docx.js'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: protocol.json — валидный и полный
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('protocol.json', encoding='utf-8'))

          for key in ['ports', 'hosts', 'tunnel', 'rules',
                      'master_to_zones', 'master_to_panel',
                      'zones_to_master', 'panel_to_master']:
              assert key in d, f'нет раздела {key}'

          for host in ['master', 'zone1', 'zone2', 'zone3', 'zone4', 'panel']:
              assert host in d['hosts'], f'нет адреса {host}'
          for port in ['zone_listens', 'master_from_panel', 'master_from_zones', 'panel_listens']:
              assert isinstance(d['ports'].get(port), int), f'порт {port} не число'

          zones = d['tunnel']['zones']
          assert zones, 'нет зон'
          for z in zones:
              assert len(z['x']) == 2 and len(z['y']) == 2, f'зона {z} без границ'
              assert z['x'][0] < z['x'][1], f'зона {z["zone"]}: xmin >= xmax'

          total = 0
          for direction in ['master_to_zones', 'master_to_panel', 'zones_to_master', 'panel_to_master']:
              msgs = d[direction]
              assert msgs, f'{direction}: пусто'
              for m in msgs:
                  assert m.get('addr', '').startswith('/'), f'{direction}: адрес не начинается со слэша: {m}'
                  assert 'args' in m, f'{m["addr"]}: нет args'
              total += len(msgs)

          print(f'protocol.json v{d["version"]} в порядке: {total} сообщений, '
                f'{len(zones)} зон, обновлён {d["updated"]}')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Пересобрать Word-версию спеки
        run: |
          npm install docx --no-save --silent
          node docs/build_protocol_docx.js "Протокол_мастера.docx"
          ls -la "Протокол_мастера.docx"

      - name: Приложить документ к запуску
        uses: actions/upload-artifact@v4
        with:
          name: Протокол_мастера
          path: Протокол_мастера.docx
